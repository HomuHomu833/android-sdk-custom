name: Make SDK (Windows)
run-name: Make SDK ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "AOSP source tag (android-* or platform-tools-*)"
        required: true
        default: "android-17.0.0_r1"
      only:
        description: "Only these targets (JSON array), default all"
        required: false
        type: string

permissions:
  contents: write
  packages: read

jobs:
  make:
    uses: ./.github/workflows/make-sdk.yml
    secrets: inherit
    with:
      platform: windows
      tag: ${{ inputs.tag }}
      only: ${{ inputs.only }}
      targets: >-
        ["x86_64-w64-mingw32", "aarch64-w64-mingw32", "i686-w64-mingw32",
         "armv7-w64-mingw32", "arm64ec-w64-mingw32"]
